services:
  - type: web
    name: progettochiaro-api
    runtime: docker
    plan: free
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: JDBC_DATABASE_URL
        value: jdbc:postgresql://aws-1-eu-west-2.pooler.supabase.com:5432/postgres?sslmode=require
      - key: JDBC_DATABASE_USERNAME
        value: postgres.asmumzntspfkfupgncgu
      - key: JDBC_DATABASE_PASSWORD
        sync: false
      - key: APP_LOGIN_USERNAME
        sync: false
      - key: APP_LOGIN_PASSWORD
        sync: false
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false

  - type: web
    name: progettochiaro-client
    runtime: static
    rootDir: client
    buildCommand: corepack enable && corepack pnpm install --frozen-lockfile && corepack pnpm build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin-allow-popups
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
