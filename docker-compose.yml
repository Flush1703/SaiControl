services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: progettochiaro
      POSTGRES_USER: progettochiaro
      POSTGRES_PASSWORD: progettochiaro
    ports:
      - "5432:5432"
    volumes:
      - progettochiaro-postgres:/var/lib/postgresql/data

volumes:
  progettochiaro-postgres:

